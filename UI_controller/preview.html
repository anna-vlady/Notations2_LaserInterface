<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CONTROL_v1.0 Touch Interface</title>
  <style>
    :root {
      /* Full-Screen Chassis Surface */
      --bg-surface: #d8d8d6;
      --track-inset-bg: #b8b8b5;
      
      --text-label: #666664;
      --text-primary: #2b2b29;
      
      /* Accent Colors */
      --color-freq-yellow: #facc15;
      --color-level-blue: #3b82f6;
      
      /* Status LEDs */
      --led-amber: #f59e0b;
      --led-grey: #888885;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Entire Screen IS the Board (100% Edge-to-Edge) */
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-surface);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Full-Screen Touch App Grid */
    .touch-screen-app {
      width: 100%;
      height: 100%;
      padding: 60px 80px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      position: relative;
    }

    /* Left Column: 2 Linear Sliders */
    .sliders-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .sliders-container {
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex: 1;
    }

    .slider-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      gap: 16px;
    }

    /* Deep Recessed Pill Track carved into the screen */
    .track-recess {
      width: 76px;
      flex: 1;
      background: var(--track-inset-bg);
      border-radius: 38px;
      position: relative;
      padding: 12px;
      display: flex;
      justify-content: center;
      box-shadow: 
        inset 5px 5px 12px rgba(0, 0, 0, 0.22),
        inset -4px -4px 10px rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(0, 0, 0, 0.04);
      touch-action: none;
      cursor: pointer;
    }

    /* Track Center Slot Line with internal padding */
    .track-line {
      position: absolute;
      top: 42px;
      bottom: 42px;
      width: 5px;
      background: rgba(0, 0, 0, 0.12);
      border-radius: 3px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Perfectly Circular Handles with travel boundaries inside track */
    .circular-knob {
      position: absolute;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      box-shadow: 
        3px 5px 12px rgba(0, 0, 0, 0.2),
        -2px -2px 6px rgba(255, 255, 255, 0.8);
      touch-action: none;
      top: 50%;
    }

    .knob-freq {
      background: linear-gradient(145deg, #fde047, #facc15);
    }

    .knob-level {
      background: linear-gradient(145deg, #60a5fa, #3b82f6);
    }

    /* Fixed height label tag to prevent layout shift */
    .label-tag {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--text-primary);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 20px;
      line-height: 20px;
      white-space: nowrap;
    }

    .value-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-label);
      font-weight: 500;
      display: inline-block;
      width: 38px;
      text-align: left;
    }

    /* Right Column: 2 Tactile Buttons directly on the screen */
    .buttons-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .buttons-container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      gap: 32px;
    }

    /* Tactile Block Buttons floating directly on the screen surface */
    .tactile-button {
      flex: 1;
      background: linear-gradient(145deg, #e4e4e2, #cccccc);
      border-radius: 18px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 
        6px 6px 16px rgba(0, 0, 0, 0.12),
        -5px -5px 12px rgba(255, 255, 255, 0.75);
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .tactile-button:active, .tactile-button.active {
      box-shadow: 
        inset 4px 4px 10px rgba(0, 0, 0, 0.2),
        inset -3px -3px 8px rgba(255, 255, 255, 0.5);
      transform: scale(0.995);
    }

    /* Clean Button Text Typography */
    .button-text {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--text-primary);
      text-transform: uppercase;
    }

    /* Integrated Status LED Dot */
    .status-led {
      position: absolute;
      top: 20px;
      right: 22px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      transition: all 0.15s ease;
    }

    .status-led.on {
      background: var(--led-amber);
      box-shadow: 0 0 10px var(--led-amber);
    }

    .status-led.off {
      background: var(--led-grey);
      box-shadow: inset 1px 1px 2px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <!-- Full-Screen Touch App Canvas -->
  <div class="touch-screen-app">
    
    <!-- COLUMN 1: 2 LINEAR SLIDERS -->
    <div class="sliders-panel">
      <div class="sliders-container">
        
        <!-- FREQ SLIDER (Yellow Circle Handle) -->
        <div class="slider-unit">
          <div class="track-recess" id="track-freq">
            <div class="track-line"></div>
            <div class="circular-knob knob-freq" id="knob-freq"></div>
          </div>
          <div class="label-tag">FREQ <span class="value-display" id="val-freq">50%</span></div>
        </div>

        <!-- LEVEL SLIDER (Blue Circle Handle) -->
        <div class="slider-unit">
          <div class="track-recess" id="track-level">
            <div class="track-line"></div>
            <div class="circular-knob knob-level" id="knob-level"></div>
          </div>
          <div class="label-tag">LEVEL <span class="value-display" id="val-level">70%</span></div>
        </div>

      </div>
    </div>

    <!-- COLUMN 2: 2 TACTILE BUTTONS DIRECTLY ON SCREEN -->
    <div class="buttons-panel">
      <div class="buttons-container">
        
        <!-- BUTTON 1: ENGAGE [E] (MOMENTARY HOLD TO TURN ON) -->
        <div class="tactile-button" id="btn-engage">
          <div class="status-led off" id="led-engage"></div>
          <div class="button-text" id="text-engage">HOLD ENGAGE [E]</div>
        </div>

        <!-- BUTTON 2: POWER [P] (TOGGLE TAP) -->
        <div class="tactile-button" id="btn-power">
          <div class="status-led off" id="led-power"></div>
          <div class="button-text">POWER [P]</div>
        </div>

      </div>
    </div>

  </div>

  <!-- Interactive Pointer Drag & Tap Scripts -->
  <script>
    function makeInteractiveSlider(trackId, knobId, valId, initialNormalizedVal) {
      const track = document.getElementById(trackId);
      const knob = document.getElementById(knobId);
      const valDisplay = document.getElementById(valId);

      let isDragging = false;

      function updatePosition(clientY) {
        const rect = track.getBoundingClientRect();
        // Safe internal padding so knob NEVER touches or overlaps track ends
        const padding = 42; 
        const minTop = padding;
        const maxTop = rect.height - padding;

        const relativeY = clientY - rect.top;
        const clampedY = Math.max(minTop, Math.min(maxTop, relativeY));

        knob.style.top = clampedY + 'px';

        // Calculate 0.0 (bottom) to 1.0 (top)
        const normalized = 1 - (clampedY - minTop) / (maxTop - minTop);
        valDisplay.textContent = Math.round(normalized * 100) + '%';
      }

      // Initialize with exact padding constraint
      const rect = track.getBoundingClientRect();
      const padding = 42;
      const initialY = (1 - initialNormalizedVal) * (rect.height - 2 * padding) + padding;
      knob.style.top = initialY + 'px';

      track.addEventListener('pointerdown', (e) => {
        isDragging = true;
        track.setPointerCapture(e.pointerId);
        updatePosition(e.clientY);
      });

      track.addEventListener('pointermove', (e) => {
        if (isDragging) {
          updatePosition(e.clientY);
        }
      });

      track.addEventListener('pointerup', (e) => {
        isDragging = false;
      });

      track.addEventListener('pointercancel', (e) => {
        isDragging = false;
      });
    }

    // Initialize interactive sliders after load
    window.addEventListener('load', () => {
      makeInteractiveSlider('track-freq', 'knob-freq', 'val-freq', 0.50);
      makeInteractiveSlider('track-level', 'knob-level', 'val-level', 0.70);

      // MOMENTARY HOLD BUTTON: HOLD ENGAGE [E]
      const btnEngage = document.getElementById('btn-engage');
      const ledEngage = document.getElementById('led-engage');

      function setEngage(active) {
        if (active) {
          ledEngage.className = 'status-led on';
          btnEngage.classList.add('active');
        } else {
          ledEngage.className = 'status-led off';
          btnEngage.classList.remove('active');
        }
      }

      btnEngage.addEventListener('pointerdown', (e) => {
        btnEngage.setPointerCapture(e.pointerId);
        setEngage(true);
      });

      btnEngage.addEventListener('pointerup', () => setEngage(false));
      btnEngage.addEventListener('pointercancel', () => setEngage(false));

      // Keyboard shortcut E for Hold Engage
      window.addEventListener('keydown', (e) => {
        if ((e.key === 'e' || e.key === 'E') && !e.repeat) {
          setEngage(true);
        }
      });
      window.addEventListener('keyup', (e) => {
        if (e.key === 'e' || e.key === 'E') {
          setEngage(false);
        }
      });

      // TOGGLE BUTTON: POWER [P]
      const btnPower = document.getElementById('btn-power');
      const ledPower = document.getElementById('led-power');
      let powerOn = false;

      btnPower.addEventListener('click', () => {
        powerOn = !powerOn;
        ledPower.className = powerOn ? 'status-led on' : 'status-led off';
        btnPower.classList.toggle('active', powerOn);
      });

      window.addEventListener('keydown', (e) => {
        if ((e.key === 'p' || e.key === 'P') && !e.repeat) {
          powerOn = !powerOn;
          ledPower.className = powerOn ? 'status-led on' : 'status-led off';
          btnPower.classList.toggle('active', powerOn);
        }
      });
    });
  </script>
</body>
</html>
